[project]
name = "netlab-cli"
version = "0.1.0"
description = "NetLab CLI — Adaptive Cisco Networking Laboratory and Assessment Environment"
readme = "README.md"
license = "MIT"
authors = [{ name = "NetLab CLI contributors" }]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
netlab = "netlab.cli.app:main"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
