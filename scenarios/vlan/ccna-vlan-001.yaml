# NetLab scenario: ccna-vlan-001 — Department VLAN Deployment
#
# The fixed first milestone scenario (architecture doc §74):
#
#                 R1
#                  |
#               trunk (802.1Q)
#                  |
#                 SW1
#                /    \
#         Gi0/2 /      \ Gi0/3
#              /        \
#          PC-A         PC-B
#         VLAN 10       VLAN 20
#
# The student creates the VLANs, assigns access ports, configures the trunk,
# configures router-on-a-stick subinterfaces, addresses the PCs, and submits.
# The grading engine compares the resulting network state against the
# requirements below — deterministically, points summing to 100.

id: ccna-vlan-001
title: Department VLAN Deployment
version: 1

difficulty: beginner

metadata:
  estimated_minutes: 20
  skills:
    - vlan
    - access-ports
    - trunking
    - router-on-a-stick
    - ipv4-addressing
    - default-gateway

topology:
  devices:
    - name: R1
      type: router
      interfaces:
        - name: GigabitEthernet0/0/0
    - name: SW1
      type: switch
      interfaces:
        - name: GigabitEthernet0/1
          description: Uplink-to-R1
        - name: GigabitEthernet0/2
          description: PC-A
        - name: GigabitEthernet0/3
          description: PC-B
    - name: PC-A
      type: pc
      interfaces:
        - name: Ethernet0
    - name: PC-B
      type: pc
      interfaces:
        - name: Ethernet0

  links:
    - source: R1:Gi0/0/0
      destination: SW1:Gi0/1
    - source: SW1:Gi0/2
      destination: PC-A:Ethernet0
    - source: SW1:Gi0/3
      destination: PC-B:Ethernet0

# Router subinterfaces (Gi0/0/0.10 / .20) are NOT pre-created: creating them is
# part of the lab. The requirement validator knows subinterface names may refer
# to interfaces that appear only after configuration.

objectives:
  - Create VLAN 10 for the Administration department and VLAN 20 for Sales.
  - Assign SW1 access ports so PC-A uses VLAN 10 and PC-B uses VLAN 20.
  - Configure the SW1 uplink to R1 as an 802.1Q trunk.
  - Configure R1 for inter-VLAN routing with router-on-a-stick subinterfaces.
  - Address the PCs so each can reach its own gateway.
  - Verify your configuration before submitting.

requirements:
  # --- VLAN configuration (20 points) ---
  - id: vlan10-exists
    category: VLAN Configuration
    description: VLAN 10 must exist on SW1
    points: 10
    type: vlan_exists
    device: SW1
    vlan_id: 10

  - id: vlan20-exists
    category: VLAN Configuration
    description: VLAN 20 must exist on SW1
    points: 5
    type: vlan_exists
    device: SW1
    vlan_id: 20

  - id: vlan10-name
    category: VLAN Configuration
    description: VLAN 10 must be named ADMIN
    points: 5
    type: vlan_name
    device: SW1
    vlan_id: 10
    name: ADMIN

  # --- Access ports (20 points) ---
  - id: sw1-gi0-2-access-vlan10
    category: Access Ports
    description: SW1 Gi0/2 must be an access port in VLAN 10
    points: 10
    type: access_vlan
    device: SW1
    interface: GigabitEthernet0/2
    vlan_id: 10

  - id: sw1-gi0-3-access-vlan20
    category: Access Ports
    description: SW1 Gi0/3 must be an access port in VLAN 20
    points: 10
    type: access_vlan
    device: SW1
    interface: GigabitEthernet0/3
    vlan_id: 20

  # --- Trunking (20 points) ---
  - id: sw1-gi0-1-trunk
    category: Trunking
    description: SW1 Gi0/1 must operate as an 802.1Q trunk
    points: 10
    type: interface_mode
    device: SW1
    interface: GigabitEthernet0/1
    mode: trunk

  - id: sw1-gi0-1-trunk-native-vlan1
    category: Trunking
    description: SW1 Gi0/1 must use VLAN 1 as the native VLAN
    points: 5
    type: trunk_native_vlan
    device: SW1
    interface: GigabitEthernet0/1
    vlan_id: 1

  - id: sw1-gi0-1-trunk-allows-user-vlans
    category: Trunking
    description: SW1 Gi0/1 must allow VLANs 10 and 20
    points: 5
    type: trunk_allowed_vlans
    device: SW1
    interface: GigabitEthernet0/1
    vlans: [10, 20]

  # --- Inter-VLAN routing (25 points) ---
  - id: r1-subif-10-encapsulation
    category: Inter-VLAN Routing
    description: R1 Gi0/0/0.10 must encapsulate 802.1Q VLAN 10
    points: 5
    type: subinterface_encapsulation
    device: R1
    interface: GigabitEthernet0/0/0.10
    vlan_id: 10

  - id: r1-subif-20-encapsulation
    category: Inter-VLAN Routing
    description: R1 Gi0/0/0.20 must encapsulate 802.1Q VLAN 20
    points: 5
    type: subinterface_encapsulation
    device: R1
    interface: GigabitEthernet0/0/0.20
    vlan_id: 20

  - id: r1-subif-10-ip
    category: Inter-VLAN Routing
    description: R1 Gi0/0/0.10 must be 192.168.10.1/24
    points: 8
    type: ip_address
    device: R1
    interface: GigabitEthernet0/0/0.10
    address: 192.168.10.1
    prefix: 24

  - id: r1-subif-20-ip
    category: Inter-VLAN Routing
    description: R1 Gi0/0/0.20 must be 192.168.20.1/24
    points: 7
    type: ip_address
    device: R1
    interface: GigabitEthernet0/0/0.20
    address: 192.168.20.1
    prefix: 24

  # --- Host addressing (15 points) ---
  - id: pc-a-ip
    category: Host Addressing
    description: PC-A must use 192.168.10.10/24
    points: 8
    type: host_ip
    device: PC-A
    interface: Ethernet0
    address: 192.168.10.10
    prefix: 24

  - id: pc-a-gateway
    category: Host Addressing
    description: PC-A must use 192.168.10.1 as its default gateway
    points: 4
    type: host_gateway
    device: PC-A
    gateway: 192.168.10.1

  - id: pc-b-ip
    category: Host Addressing
    description: PC-B must use 192.168.20.10/24
    points: 3
    type: host_ip
    device: PC-B
    interface: Ethernet0
    address: 192.168.20.10
    prefix: 24

grading:
  total: 100
